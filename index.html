<meta name="description" content="以笔为刃，以墨为命：一笔一划伏墨妖的水墨动作肉鸽。">
<meta name="theme-color" content="#efe6d0">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #efe6d0; overflow: hidden; overscroll-behavior: none; }
  /* 画布只占安全区：刘海、圆角、底部横条处留成纸色 */
  #stage { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
  canvas { display: block; touch-action: none; cursor: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<script>
  // 开卷失败时把原因写在纸上（手机上看不到控制台）：脚本载入失败、启动时出错，或十五秒还没开卷。
  // 游戏第一帧画出来后（src/game/input.js 置 __inkStarted）就撤掉。只用老写法，越老的浏览器也能跑。
  (function () {
    var errs = [];
    function show() {
      if (window.__inkStarted) return;
      var el = document.getElementById('boot-err');
      if (!el) {
        el = document.createElement('div'); el.id = 'boot-err';
        el.style.cssText = 'position:fixed;left:20px;right:20px;top:28%;font:15px/1.8 serif;color:#3a3530;text-align:center;white-space:pre-wrap;word-break:break-all;z-index:9';
        document.body.appendChild(el);
      }
      var NL = String.fromCharCode(10);
      el.textContent = '墨灵没能开卷' + (errs.length ? '：' + NL + errs.slice(0, 4).join(NL) : '（等了十五秒还没开卷）') +
        NL + NL + '请稍候刷新一两次；仍不行，请截图发给作者。' + NL + navigator.userAgent;
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'SCRIPT') errs.push('没能载入 ' + String(t.src).split('/').slice(-2).join('/'));
      else errs.push((e.message || '出错') + (e.filename ? '（' + String(e.filename).split('/').pop() + ' 第 ' + e.lineno + ' 行）' : ''));
      if (errs.length === 1) setTimeout(show, 1500);
    }, true);
    setTimeout(show, 15000);
  })();
</script>

  if ('serviceWorker' in navigator && window.isSecureContext) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
